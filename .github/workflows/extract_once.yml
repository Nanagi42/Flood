name: Extract Flood Trace by Sido (1-Time)

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 필수 패키지 설치
        run: pip install requests urllib3 shapely

      - name: 침수흔적도 시도별 GeoJSON 추출 실행
        env:
          SAFETYDATA_API_KEY: ${{ secrets.SAFETYDATA_API_KEY }}
        run: python fetch_flood_trace_to_geojson.py

      - name: 추출된 시도별 GeoJSON 파일 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.geojson
          git diff --staged --quiet || git commit -m "Add province-level flood trace GeoJSON files"
          git push
